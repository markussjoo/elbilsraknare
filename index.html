<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06484c"><title>Elbilsräknare | Retropumpen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif}body{background:radial-gradient(ellipse at 50% 15%,#25666b,#062b34 70%);color:#17383a;display:grid;place-items:center;padding:8px}main{width:min(100%,420px);height:min(820px,calc(100dvh - 16px));min-height:0;background:linear-gradient(100deg,#07484c,#14767a 14%,#0b5559 80%,#073b40);border:4px solid #c8a96c;border-radius:25px;box-shadow:0 18px 35px #001a22, inset 0 0 0 4px #06363b;display:flex;flex-direction:column;padding:clamp(8px,2vh,17px);gap:clamp(6px,1.3vh,12px);overflow:hidden}.brand{text-align:center;color:#fff3c9;flex:none}.brand h1{font-family:Georgia,serif;font-style:italic;font-size:clamp(22px,4.5vh,37px);line-height:1;margin:0;text-shadow:2px 2px #002e34}.brand p{font-size:clamp(9px,1.4vh,12px);letter-spacing:2px;margin:5px 0 0}.panel{border:3px ridge #c9b88c;border-radius:14px;background:linear-gradient(145deg,#f8f1d9,#d9cfac);box-shadow:inset 0 0 16px #ad9b72,0 5px 9px #003237;padding:clamp(9px,2vh,18px)}.upper{flex:0 1 38%;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:6px}.counter-label{text-align:center;font-size:clamp(10px,1.7vh,14px);font-weight:900;letter-spacing:2px}.counter{background:#101a1b;border:3px solid #947a55;border-radius:7px;box-shadow:inset 0 3px 9px #000,0 2px 1px #fff8;display:flex;align-items:center;justify-content:center;padding:clamp(4px,1vh,9px);gap:4px;color:#f5f0d9}.digits{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(26px,5.5vh,48px);font-weight:900;letter-spacing:2px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15;text-shadow:0 -2px #777;transition:transform .18s ease}.counter.flash .digits{animation:roll .28s ease-out}@keyframes roll{0%{transform:translateY(-9px);opacity:.5}100%{transform:translateY(0);opacity:1}}.unit{font-size:clamp(11px,2vh,16px);font-weight:800;color:#9ce1d8;align-self:end}.lower{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;gap:clamp(5px,1vh,10px)}.section-label{font-weight:900;font-size:clamp(10px,1.6vh,13px);letter-spacing:1px;text-transform:uppercase}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.value{background:#142326;color:#f3ebd1;padding:4px 8px;border:2px solid #b5a17a;border-radius:5px;font-family:ui-monospace,monospace;font-weight:800;font-size:clamp(15px,2.8vh,23px);font-variant-numeric:tabular-nums;min-width:80px;text-align:right}input[type=range]{width:100%;height:clamp(24px,4vh,35px);accent-color:#007d82;cursor:pointer;touch-action:pan-x;margin:0}input[type=number]{width:clamp(100px,38%,150px);min-width:0;border:2px solid #b5a17a;background:#152528;color:#f6edda;border-radius:5px;padding:clamp(5px,1vh,9px);font:800 clamp(17px,2.8vh,23px) ui-monospace,monospace;text-align:right}input:focus-visible{outline:3px solid #00b9b3;outline-offset:2px}.foot{text-align:center;color:#e4d2a4;font-size:clamp(9px,1.3vh,11px);flex:none}@media(max-height:650px){main{gap:5px;padding:7px}.panel{padding:7px}.upper{flex-basis:35%}.brand p{display:none}.counter{padding:3px}.lower{gap:2px}input[type=range]{height:25px}}@media(max-height:520px){.foot{display:none}.brand h1{font-size:20px}.upper{flex-basis:32%}.digits{font-size:24px}.section-label{font-size:10px}}
</style></head><body><main><header class="brand"><h1>Elbilsräknare ⚡</h1><p>RETROPUMPEN · ELEKTRISK ENERGI</p></header><section class="panel upper" aria-label="Resultat"><div><div class="counter-label">TOTALPRIS</div><div class="counter" id="costBox"><span class="digits" id="cost">052,20</span><span class="unit">kr</span></div></div><div><div class="counter-label">LADDAT</div><div class="counter" id="energyBox"><span class="digits" id="energy">034,8</span><span class="unit">kWh</span></div></div></section><section class="panel lower" aria-label="Laddningsinställningar"><div><div class="row"><label class="section-label" for="from">Från</label><output class="value" id="fromVal">20 %</output></div><input id="from" type="range" min="0" max="100" value="20"></div><div><div class="row"><label class="section-label" for="to">Till</label><output class="value" id="toVal">80 %</output></div><input id="to" type="range" min="0" max="100" value="80"></div><div class="row"><label class="section-label" for="capacity">Batterikapacitet (kWh)</label><input id="capacity" type="number" inputmode="decimal" min="1" max="300" step="0.1" value="58"></div><div class="row"><label class="section-label" for="price">Pris per kWh (kr)</label><input id="price" type="number" inputmode="decimal" min="0" step="0.01" value="1.50"></div></section><footer class="foot">Beräknat på användbar batterikapacitet · exkl. laddförluster</footer></main><script>
const $=id=>document.getElementById(id),fmt=(n,d)=>n.toFixed(d).replace('.',','),num=id=>Math.max(0,Number($(id).value.replace?.(',','.')??$(id).value)||0);let prev={};function update(){let a=+$('from').value,b=+$('to').value;if(a>b){if(document.activeElement===$('from')){$('to').value=a;b=a}else{$('from').value=b;a=b}}$('fromVal').textContent=a+' %';$('toVal').textContent=b+' %';let energy=(b-a)/100*num('capacity'),cost=energy*num('price');for(const [id,v] of Object.entries({energy:fmt(energy,1).padStart(5,'0'),cost:fmt(cost,2).padStart(6,'0')})){if(prev[id]!==v){$(id).textContent=v;const box=$(id+'Box');box.classList.remove('flash');void box.offsetWidth;box.classList.add('flash');prev[id]=v}}}for(const id of ['from','to','capacity','price'])$(id).addEventListener('input',update);update();
</script></body></html>
